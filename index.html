<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Field Scope Checklist</title>
<meta name="description" content="Water, fire, roofing, interior and exterior inspection checklist that builds an Xactimate-style estimate. Works offline.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151F29" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Field Scope">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif}img{max-width:100%}[hidden]{display:none!important}

/* Layout: field-form tool. Sticky claim bar + trade tabs; each trade = inspection checklist, calculator, catalog quick-add, editable lines. Estimate tab renders an Xactimate-style report. */
:root{
  --bg:#EDF0F3; --panel:#FFFFFF; --sunk:#F5F7F9; --ink:#15212C; --muted:#5B6875; --line:#D3DAE1;
  --accent:#1C5DA6; --accent-soft:#E2ECF7; --on-accent:#FFFFFF;
  --ok:#1F7A4D; --warn:#A75A0A; --bad:#B42318;
  --t-water:#1E6FB8; --t-fire:#C2410C; --t-roof:#7A5A2E; --t-interior:#6F5A9A; --t-exterior:#2F7D5B;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --panel:#151F29; --sunk:#111A22; --ink:#E4EAF0; --muted:#93A1AE; --line:#283643;
  --accent:#6AA6E8; --accent-soft:#1B2D42; --on-accent:#0B1520;
  --ok:#4CC08A; --warn:#E8A04A; --bad:#F07A6E;
  --t-water:#5FA6EA; --t-fire:#F08A52; --t-roof:#C9A26A; --t-interior:#A991D6; --t-exterior:#5CC294;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --panel:#151F29; --sunk:#111A22; --ink:#E4EAF0; --muted:#93A1AE; --line:#283643;
  --accent:#6AA6E8; --accent-soft:#1B2D42; --on-accent:#0B1520;
  --ok:#4CC08A; --warn:#E8A04A; --bad:#F07A6E;
  --t-water:#5FA6EA; --t-fire:#F08A52; --t-roof:#C9A26A; --t-interior:#A991D6; --t-exterior:#5CC294;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.01em;margin:0}
.claimtag{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.spacer{flex:1}
.rcv{display:flex;align-items:baseline;gap:8px}
.rcv .lbl{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rcv .val{font-family:var(--f-mono);font-weight:500;font-size:18px;font-variant-numeric:tabular-nums}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:14px;padding:9px 12px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tc,var(--accent))}
.tab .n{font-family:var(--f-mono);font-size:11px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:0 6px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tc,var(--accent));display:inline-block}
main{padding-block:20px 60px}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:16px;margin:0 0 10px;letter-spacing:.01em}
.eyebrow{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sec-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.sec-head p{margin:4px 0 0;color:var(--muted);max-width:65ch}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:16px;margin-bottom:16px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.panel + .panel{margin-top:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.flabel{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input.num{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.btn{appearance:none;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.02em;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{padding:4px 8px;font-size:12px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{color:var(--muted);font-size:12.5px;margin:8px 0 0}
.checklist{display:flex;flex-direction:column}
.ck{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ck:first-child{border-top:0}
.ck .q{min-width:0}
.ck .q small{display:block;color:var(--muted);font-size:12px}
.ck.wide{grid-template-columns:minmax(0,1fr)}
.ck.mine .q::before{content:"Yours";font-family:var(--f-display);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tc,var(--accent));border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-right:6px;vertical-align:1px}
.ck .ans{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.ck.wide .ans{justify-content:stretch}
.ck.wide .ans input{flex:1}
.ck-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.ck-add input[type="text"]{flex:1 1 220px}
.ck-add select{width:auto}
.ck-add label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.ck-add input[type="checkbox"]{width:auto}
.offline{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 16px;margin-bottom:16px}
.offline p{margin:0;flex:1;min-width:220px;font-size:13px;color:var(--muted)}
.offline b{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--panel);color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:12px;padding:4px 10px;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"][data-v="Yes"]{background:var(--ok);color:var(--on-accent)}
.seg button[aria-pressed="true"][data-v="No"]{background:var(--bad);color:var(--on-accent)}
.seg button[aria-pressed="true"][data-v="N/A"]{background:var(--muted);color:var(--panel)}
.ck select,.ck input{width:auto;max-width:170px}
.ck input[type="text"]{max-width:none;width:100%}
.progress{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin:2px 0 12px}
.progress i{display:block;height:100%;background:var(--tc,var(--accent))}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%}
th{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.code{font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.code b{font-weight:500;color:var(--tc,var(--accent))}
.money{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.cat-table td input,.cat-table td select{padding:4px 6px}
.lines-table input,.lines-table select{padding:4px 6px}
.w-qty{width:84px}.w-price{width:92px}.w-unit{width:62px}.w-act{width:64px}.w-area{width:140px}.w-cat{width:62px}.w-sel{width:78px}
.lines-table .desc{min-width:220px}
.empty{padding:20px;text-align:center;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:11.5px;background:var(--sunk);border:1px solid var(--line);border-radius:3px;padding:2px 6px;color:var(--muted)}
.chip b{color:var(--ink);font-weight:500}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:16px;font-size:13px}
.banner p{margin:0;flex:1;min-width:220px}
.calc-out{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:12px 0}
.calc-out div{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px}
.calc-out span{display:block;font-family:var(--f-display);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.calc-out b{font-family:var(--f-mono);font-weight:500;font-size:16px}
.rooms td input{padding:4px 6px}
/* report */
.report{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px;min-width:0}
.rep-head{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 24px;padding-bottom:16px;border-bottom:2px solid var(--ink);margin-bottom:16px;font-size:13px}
.rep-head div span{color:var(--muted);display:inline-block;min-width:110px}
.rep-title{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;margin-bottom:12px}
.rep-title h2{font-size:22px}
.area-h{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.03em;text-transform:uppercase;margin:20px 0 6px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.area-h small{font-family:var(--f-mono);font-weight:400;font-size:11.5px;color:var(--muted);text-transform:none;letter-spacing:0}
.rep-table td{font-size:13px}
.rep-table .ln{color:var(--muted);font-family:var(--f-mono);font-size:12px;width:36px}
.rep-table tfoot td{font-weight:600;border-top:1px solid var(--ink)}
.summary{margin-top:24px;margin-left:auto;max-width:420px}
.summary div{display:flex;justify-content:space-between;gap:16px;padding:5px 0;border-bottom:1px solid var(--line)}
.summary div.tot{font-weight:600;border-bottom:2px solid var(--ink)}
.summary div.net{font-weight:700;font-size:16px;border-bottom:0}
.flags li{margin-bottom:4px}
.agent-out{white-space:pre-wrap;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:12px;min-height:120px;font-size:13.5px;max-height:520px;overflow:auto}
.status{font-size:12.5px;color:var(--muted)}
.status.err{color:var(--bad)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:6px;padding:18px;text-align:center;cursor:pointer;background:var(--sunk);color:var(--muted)}
.drop:hover,.drop.over{border-color:var(--tc,var(--accent));color:var(--ink)}
.drop b{font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--ink)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:12px}
.pcard{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;min-width:0}
.pcard .ph{position:relative;aspect-ratio:4/3;background:var(--sunk);max-width:100%}
.pcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .ph .num{position:absolute;left:6px;top:6px;font-family:var(--f-mono);font-size:11px;background:var(--panel);color:var(--ink);border-radius:3px;padding:1px 6px}
.pcard .ph .tr{position:absolute;right:6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--tc,var(--accent));border:2px solid var(--panel)}
.pcard .pb{padding:8px;display:flex;flex-direction:column;gap:6px}
.pcard .pb input,.pcard .pb select{padding:4px 6px;font-size:12.5px}
.pcard .pb .row{justify-content:space-between}
.eq-table td input,.eq-table td select{padding:4px 6px}.w-dt{width:190px}.w-tag{width:130px}.onsite{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--warn)}
.psheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:560px){.psheet{grid-template-columns:minmax(0,1fr)}}
.psheet figure{margin:0;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.psheet img{width:100%;max-height:340px;object-fit:contain;background:var(--sunk);display:block}
.psheet figcaption{padding:6px 8px;font-size:12.5px}
.psheet figcaption b{font-family:var(--f-mono);font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:4px;font-size:13px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:12.5px}
/* iPhone / iPad */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,.tab,label.btn,.seg button,select{touch-action:manipulation}
@media (pointer:coarse){
  input,select,textarea{font-size:16px}
  input,select{min-height:40px}
  .btn{min-height:40px;padding:8px 14px}
  .btn.small{min-height:36px;padding:6px 11px}
  .seg button{min-height:38px;padding:6px 14px;font-size:13px}
  .tab{padding:12px 14px 13px}
  input[type="checkbox"]{width:22px!important;height:22px;min-height:0}
  .ck select,.ck input{max-width:190px}
}
@media (max-width:640px){
  .bar-top{padding-block:8px;gap:8px 12px;flex-wrap:nowrap}
  .brand{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .claimtag{display:none}
  .rcv .val{font-size:15px}
  .mwrap{overflow:visible;border:0;background:none;border-radius:0}
  table.mcard,table.mcard tbody,table.mcard td{display:block;width:100%}
  table.mcard thead{display:none}
  table.mcard tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:10px}
  table.mcard td{border:0;padding:0;min-width:0}
  table.mcard td[data-label]::before{content:attr(data-label);display:block;font-family:var(--f-display);font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  table.mcard td.wide{grid-column:1/-1}
  table.mcard td.act{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}
  table.mcard td.money{text-align:left}
  table.mcard td input:not([type="checkbox"]),table.mcard td select{width:100%!important;max-width:none!important;min-width:0!important}
  table.mcard td .row{flex-wrap:wrap}
}
.sugg{border:1.5px solid var(--tc,var(--accent))}
.sugg-n{display:inline-block;font-family:var(--f-mono);font-size:12px;font-weight:500;background:var(--tc,var(--accent));color:var(--on-accent);border-radius:10px;padding:0 7px;vertical-align:2px;margin-left:4px}
.sugg-list{display:flex;flex-direction:column}
.sugg-row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.sugg-row:first-child{border-top:0}
.sugg-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.sugg-meta,.sugg-why{font-size:12.5px;color:var(--muted)}
.setq{color:var(--warn);font-weight:600}
.m-dry{color:var(--ok);font-weight:600}.m-wet{color:var(--warn);font-weight:600}
.catsearch{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.catsearch input{flex:1}
@media (max-width:640px){.sugg-row{flex-direction:column;align-items:stretch}.sugg-row .row{justify-content:flex-end}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){.report{padding:14px}.rcv .val{font-size:16px}}
.claims{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.claim-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}.claim-card.cur{border-color:var(--accent)}@media (max-width:400px){.claims{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="bar-top">
      <h1 class="brand">Field Scope Checklist</h1>
      <span class="claimtag" id="claimTag"></span>
      <span class="chip" id="offChip" hidden>Offline · saving on this device</span>
      <span class="spacer"></span>
      <button class="btn small primary" id="installBtn" data-act="install" hidden>Install app</button>
      <button class="btn small" data-act="claims">Claims</button>
      <div class="rcv"><span class="lbl">Line items</span><span class="val" id="rcvTop">0</span></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- Catalog (unit prices are placeholders) ---------- */
const TRADES = {
  water:{name:"Water Mitigation",short:"Water",color:"--t-water"},
  fire:{name:"Fire & Smoke",short:"Fire & Smoke",color:"--t-fire"},
  roof:{name:"Roofing",short:"Roofing",color:"--t-roof"},
  interior:{name:"Interior",short:"Interior",color:"--t-interior"},
  exterior:{name:"Exterior",short:"Exterior",color:"--t-exterior"}

const EQUIP = {
  am:{name:"Air mover",cat:"WTR",sel:"DRY",rate:35,trade:"water"},
  dhl:{name:"Dehumidifier - Large (LGR)",cat:"WTR",sel:"DHM",rate:95,trade:"water"},
  dhx:{name:"Dehumidifier - XLarge (LGR)",cat:"WTR",sel:"DHMXL",rate:125,trade:"water"},
  des:{name:"Desiccant dehumidifier",cat:"WTR",sel:"DESIC",rate:225,trade:"water"},
  afd:{name:"Air scrubber / negative air",cat:"WTR",sel:"NAFAN",rate:85,trade:"water"},
  wcd:{name:"Wall cavity / floor drying system",cat:"WTR",sel:"WCDS",rate:75,trade:"water"},
  heat:{name:"Heat drying unit",cat:"WTR",sel:"HEAT",rate:150,trade:"water"},
  hyd:{name:"Hydroxyl generator",cat:"CLN",sel:"HYD",rate:110,trade:"fire"},
  ozn:{name:"Ozone generator",cat:"CLN",sel:"OZN",rate:95,trade:"fire"},
  other:{name:"Other equipment",cat:"WTR",sel:"",rate:0,trade:"water"}
};
let equipArea = "r1";
const pad2 = v => String(v).padStart(2,"0");
function nowLocal(){ const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function equipHours(q){ if(!q.placed) return null; const a=new Date(q.placed), b=q.removed? new Date(q.removed) : new Date(); const h=(b-a)/36e5; return isFinite(h)&&h>0? h : 0; }
function equipDays(q){ if(String(q.days??"").trim()!=="") return Math.max(0,n(q.days)); const h=equipHours(q); return h==null? 0 : Math.max(1,Math.ceil(h/24 - 0.01)); }
function equipCost(q){ return r2(n(q.units)*equipDays(q)*n(q.rate)); }
function addEquip(type, area, o={}){ const t=EQUIP[type]||EQUIP.other; S.equip.push({id:uid(),type,name:t.name,area:area||"",units:o.units??1,tag:"",placed:o.days?"":nowLocal(),removed:"",days:o.days??"",rate:t.rate,cat:t.cat,sel:t.sel,trade:t.trade}); }
function equipLines(list){
  const g={}; for(const q of list){ const d=equipDays(q), u=n(q.units); if(!(d*u>0)) continue;
    const k=[q.area,q.cat,q.sel,q.rate,q.name].join("|"); (g[k] ||= {q,qty:0}).qty += u*d; }
  return Object.values(g).map(({q,qty})=>({id:uid(),trade:q.trade||"water",area:q.area,cat:q.cat,sel:q.sel,act:"+",desc:`${q.name} (per 24 hour period)`,qty:r2(qty),unit:"EA",price:n(q.rate),note:"Equipment log"}));
}
function syncEquip(){ S.lines=S.lines.filter(l=>l.note!=="Equipment log"); S.lines.push(...equipLines(S.equip)); }
function equipTotals(){ let units=0,ud=0,cost=0,onsite=0; for(const q of S.equip){ units+=n(q.units); ud+=n(q.units)*equipDays(q); cost+=equipCost(q); if(!q.removed && String(q.days??"").trim()==="" && q.placed) onsite+=n(q.units); } return {units,ud,cost:r2(cost),onsite}; }
function equipSummary(t){ return `<div><span>Units logged</span><b>${qfmt(t.units)}</b></div><div><span>Unit-days</span><b>${qfmt(t.ud)}</b></div><div><span>Still on site</span><b>${qfmt(t.onsite)}</b></div>`; }
function updateEquipRow(q){ const d=document.querySelector(`[data-eqd="${q.id}"]`), c=document.querySelector(`[data-eqc="${q.id}"]`); if(d) d.textContent=equipDays(q); const tt=$("#eqTot"); if(tt) tt.innerHTML=equipSummary(equipTotals()); }
function pageEquip(){
  const T=equipTotals();
  const rows=S.equip.map(q=>{ const live=!q.removed && String(q.days??"").trim()==="" && q.placed; return `<tr>
    <td><select data-eq="${q.id}" data-f="type" aria-label="Equipment type" style="min-width:190px">${Object.entries(EQUIP).map(([k,v])=>`<option value="${k}" ${k===q.type?"selected":""}>${esc(v.name)}</option>`).join("")}</select>
      ${q.type==="other"?`<input data-eq="${q.id}" data-f="name" value="${esc(q.name)}" aria-label="Equipment name" style="margin-top:4px">`:""}</td>
    <td><select class="w-area" data-eq="${q.id}" data-f="area" aria-label="Area">${areaOptions(q.area)}</select></td>
    <td><input class="num" style="width:60px" inputmode="decimal" data-eq="${q.id}" data-f="units" value="${esc(q.units)}" aria-label="Units"></td>
    <td><input class="w-tag" data-eq="${q.id}" data-f="tag" value="${esc(q.tag)}" placeholder="Asset tag / serial" aria-label="Asset tag"></td>
    <td><input class="w-dt" type="datetime-local" data-eq="${q.id}" data-f="placed" value="${esc(q.placed)}" aria-label="Date placed"></td>
    <td><input class="w-dt" type="datetime-local" data-eq="${q.id}" data-f="removed" value="${esc(q.removed)}" aria-label="Date removed">${live?`<div class="row" style="margin-top:4px"><span class="onsite">On site</span><button class="btn small" data-act="removenow" data-id="${q.id}">Removed now</button></div>`:""}</td>
    <td><input class="num" style="width:64px" inputmode="decimal" data-eq="${q.id}" data-f="days" value="${esc(q.days)}" placeholder="auto" aria-label="Days override"></td>
    <td class="money" data-eqd="${q.id}">${equipDays(q)}</td>
    <td><div class="row" style="flex-wrap:nowrap;gap:4px"><span class="code"><b>${esc(q.cat)}</b></span><input class="w-sel code" data-eq="${q.id}" data-f="sel" value="${esc(q.sel)}" aria-label="Selector"></div></td>
    <td><button class="btn ghost small" data-act="delequip" data-id="${q.id}" aria-label="Remove equipment">✕</button></td></tr>`; }).join("");
  return `${exampleBanner()}<div class="sec-head" style="--tc:var(--t-water)"><div><span class="eyebrow"><span class="dot"></span> Drying &amp; air equipment</span><h2>Equipment log</h2><p>Log each piece of equipment with where it went, and when it was set and pulled. Days count in 24-hour periods from placed to removed, and every entry adds to the scope automatically.</p></div></div>

function shrink(file, max, q){
  return new Promise((res,rej)=>{ const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(b=>b?res({blob:b,data:c.toDataURL("image/jpeg",q)}):rej(),"image/jpeg",q); };
    img.onerror=()=>{URL.revokeObjectURL(url);rej();}; img.src=url; });
}
async function addPhotos(files, t){

async function srcToBlob(src){ const r=await fetch(src); return await r.blob(); }
async function srcToData(src){ if(src.startsWith("data:")) return src; try{ const b=await srcToBlob(src); return await new Promise(res=>{const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>res(""); fr.readAsDataURL(b);}); }catch(e){ return ""; } }

function moistSummary(){
  const pts={}; moist().forEach(m=>{ const k=pointKey(m); if(!pts[k]||m.date>=pts[k].date) pts[k]=m; });
  const latest=Object.values(pts); const dates=[...new Set(moist().map(m=>m.date).filter(Boolean))].sort();
  const done=latest.filter(m=>mStatus(m)==="dry").length, read=latest.filter(m=>mStatus(m)).length;
  return {points:latest.length, dry:done, read, days:dates.length, last:dates[dates.length-1]||"", allDry: latest.length>0 && done===latest.length};
}
function moistCards(s){ return `<div><span>Points tracked</span><b>${s.points}</b></div><div><span>At drying goal</span><b>${s.dry} of ${s.points}</b></div><div><span>Days logged</span><b>${s.days}</b></div><div><span>Status</span><b class="${s.allDry?"m-dry":"m-wet"}">${s.points?(s.allDry?"Goal met":"Still drying"):"—"}</b></div>`; }
function pageMoisture(){
  const list=[...moist()].sort((a,b)=>(a.date||"").localeCompare(b.date||"")||areaName(a.area).localeCompare(areaName(b.area))||(a.point||"").localeCompare(b.point||""));
  if(!moistArea || !roomById(moistArea)) moistArea = waterRooms()[0]?.id || roomList()[0]?.id || "";
  const rows=list.map(m=>{ const st=mStatus(m); return `<tr>
    <td><input type="date" data-m="${m.id}" data-f="date" value="${esc(m.date)}" aria-label="Date"></td>
    <td><select class="w-area" data-m="${m.id}" data-f="area" aria-label="Area">${areaOptions(m.area,r=>r.kind==="room")}</select></td>
    <td><input data-m="${m.id}" data-f="point" value="${esc(m.point)}" placeholder="e.g. N wall, 6 in up" aria-label="Location" style="min-width:150px"></td>
    <td><select data-m="${m.id}" data-f="material" aria-label="Material">${MATERIALS.map(x=>`<option ${x===m.material?"selected":""}>${x}</option>`).join("")}</select></td>
    <td><input class="num" style="width:72px" inputmode="decimal" data-m="${m.id}" data-f="reading" value="${esc(m.reading)}" aria-label="Reading"></td>
    <td><input class="num" style="width:72px" inputmode="decimal" data-m="${m.id}" data-f="goal" value="${esc(m.goal)}" aria-label="Dry goal"></td>
    <td data-mst="${m.id}">${st==="dry"?'<span class="m-dry">Dry</span>':st==="wet"?'<span class="m-wet">Wet</span>':'<span class="status">—</span>'}</td>
    <td><button class="btn ghost small" data-mact="del" data-id="${m.id}" aria-label="Remove reading">✕</button></td></tr>`; }).join("");
  return `${exampleBanner()}<div class="sec-head" style="--tc:var(--t-water)"><div><span class="eyebrow"><span class="dot"></span> Drying documentation</span><h2>Moisture readings</h2><p>Log each monitoring point every day with its reading and the dry goal you took from unaffected material. A point is dry once its reading is at or below the goal; the log prints with the report.</p></div></div>
  <div class="calc-out" id="mTot" style="margin-top:0">${moistCards(moistSummary())}</div>
  <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">Readings</h3>
    <div class="row"><label class="flabel" for="mArea">New point in</label><select id="mArea" data-marea style="width:auto">${areaOptions(moistArea,r=>r.kind==="room")}</select>
    <button class="btn small" data-mact="add">+ Reading</button>${list.length?`<button class="btn small primary" data-mact="nextday">Start next day's readings</button>`:""}</div></div>
  ${list.length?`<div class="tscroll"><table class="m-table"><thead><tr><th>Date</th><th>Area</th><th>Location</th><th>Material</th><th class="r">Reading</th><th class="r">Dry goal</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
   :`<div class="tscroll"><div class="empty">No readings yet. Pick a room and tap + Reading for each monitoring point.</div></div>`}
  <p class="note">"Start next day's readings" copies every point from the most recent day with a blank reading. Use the same meter and scale for a point every day.</p></div>`;
}
function moistureSheet(){
  if(!moist().length) return "";
  const dates=[...new Set(moist().map(m=>m.date).filter(Boolean))].sort().slice(-7);
  const pts={}; moist().forEach(m=>{ const k=pointKey(m); (pts[k] ||= {m,by:{}}).by[m.date]=m; if(m.goal!=="") pts[k].m=m; });
  const fd=d=>{ const [y,mo,da]=d.split("-"); return `${+mo}/${+da}`; };
  const s=moistSummary();
  return `<div class="area-h">Moisture log <small>${s.points} points · ${s.dry} at goal · ${s.allDry?"drying goal met":"still drying"}</small></div><div class="tscroll"><table class="rep-table"><thead><tr><th>Point</th><th class="r">Goal</th>${dates.map(d=>`<th class="r">${fd(d)}</th>`).join("")}</tr></thead><tbody>
  ${Object.values(pts).map(({m,by})=>`<tr><td>${esc(areaName(m.area))} · ${esc(m.point||"")}<div class="code">${esc(m.material)}</div></td><td class="money">${esc(m.goal)}</td>${dates.map(d=>{ const x=by[d]; const st=x?mStatus(x):""; return `<td class="money" style="${st==="wet"?"font-weight:600":""}">${x&&String(x.reading).trim()!==""?esc(x.reading):"—"}</td>`; }).join("")}</tr>`).join("")}
  </tbody></table></div>`;
}
function updateMoistRow(m){
  const st=mStatus(m), c=document.querySelector(`[data-mst="${m.id}"]`);
  if(c) c.innerHTML = st==="dry"?'<span class="m-dry">Dry</span>':st==="wet"?'<span class="m-wet">Wet</span>':'<span class="status">—</span>';
  const t=document.getElementById("mTot"); if(t) t.innerHTML=moistCards(moistSummary());
}

const IDB = { db:null };
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open("scope-checklist",1);
  r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains("claims")) d.createObjectStore("claims",{keyPath:"id"}); if(!d.objectStoreNames.contains("meta")) d.createObjectStore("meta"); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function idbReq(store,mode,fn){ return new Promise((res,rej)=>{ const tx=IDB.db.transaction(store,mode); const q=fn(tx.objectStore(store));
  tx.oncomplete=()=>res(q?.result); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); }
const idbGet=(s,k)=>idbReq(s,"readonly",st=>st.get(k));
const idbPut=(s,v,k)=>idbReq(s,"readwrite",st=>k===undefined?st.put(v):st.put(v,k));
const idbDel=(s,k)=>idbReq(s,"readwrite",st=>st.delete(k));
const idbAll=s=>idbReq(s,"readonly",st=>st.getAll());
async function persist(){
  clearTimeout(saveT); if(!S) return;
  if(!S.id) S.id=uid(); S.updated=Date.now();
  const snap=JSON.parse(JSON.stringify(S));
  if(!IDB.db){ try{ localStorage.setItem(KEY,JSON.stringify(snap)); }catch(e){ photoFull=true; } return; }
  try{ await idbPut("claims",snap); await idbPut("meta",snap.id,"current"); }
  catch(e){ toast("This device couldn't save the claim. Save a claim file from the Estimate tab."); }
}
function normalize(){
  if(!Array.isArray(S.photos)) S.photos=[]; if(!Array.isArray(S.equip)) S.equip=[];
  if(!S.water) S.water={area:0,cls:"2",rooms:1,days:3,dehuPints:110};
  if(!S.roof) S.roof={sq:0,waste:10,ridge:0,hip:0,valley:0,eaves:0,rakes:0,pitch:6,stories:1,layers:1,pipes:0,step:0,vent:0};
  const rm=S.rooms.find(r=>r.kind==="room"), rf=S.rooms.find(r=>r.kind==="roof"), ev=S.rooms.find(r=>r.kind==="elev");
  if(!roomById(S.water.target)) S.water.target=rm?.id||""; if(!roomById(S.roof.area)) S.roof.area=rf?.id||"";
  addArea={water:rm?.id||"",fire:rm?.id||"",roof:rf?.id||"",interior:rm?.id||"",exterior:ev?.id||""};
  equipArea=rm?.id||"";
}

/* ---------- Claims screen ---------- */
function claimTotals(c){ const keep=S; try{ S=c; return totals(); } finally{ S=keep; } }
function pageClaims(){
  setTimeout(fillClaims,0);
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  return `<div class="sec-head"><div><span class="eyebrow">On this device</span><h2>Claims</h2><p>Every claim saves on this device as you work, photos included, and works without a signal. Save a claim file from the Estimate tab to back one up or move it to another device.</p></div><span class="spacer"></span><button class="btn primary" data-act="newclaim2">New claim</button></div>
  ${ios&&!standalone?`<div class="banner"><p><b>Install on iPhone or iPad:</b> in Safari, tap Share, then <b>Add to Home Screen</b>.</p></div>`:""}
  <div id="claimList"><div class="panel empty">Loading claims…</div></div>
  <div class="grid2" style="margin-top:16px">
    <div class="panel"><h3>AI agent</h3><p class="status" id="aiState">${esc(sampleFn? (aiInfo.needsCode?"Connected. This server needs an access code.":"Connected.") : (aiInfo.reason||"Checking…"))}</p>
      ${aiInfo.needsCode||!sampleFn?`<div class="field" style="max-width:320px;margin-top:10px"><label for="aiCode">Access code</label><input id="aiCode" type="password" autocomplete="off" value="${esc(getCode())}"></div><p class="note">Get the code from whoever set up this app. It's stored only on this device.</p>`:""}</div>
    <div class="panel"><h3>Storage</h3><p class="status" id="storeState">Checking…</p></div>
  </div>`;
}
async function fillClaims(){
  const box=$("#claimList"); if(!box) return;
  let list=[]; try{ list=IDB.db? await idbAll("claims") : [S]; }catch(e){ list=[S]; }
  list=list.map(c=>c.id===S.id?S:c); list.sort((a,b)=>(b.updated||0)-(a.updated||0));
  box.innerHTML = list.length? `<div class="claims">${list.map(c=>{ const cur=c.id===S.id; const t=claimTotals(c); return `<article class="claim-card${cur?" cur":""}">
    <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap"><div style="min-width:0"><h3 style="margin:0">${esc(c.claim.insured||"Untitled claim")}</h3><div class="code">${esc(c.claim.claimNo||"No claim #")}</div></div>${cur?`<span class="chip">Open now</span>`:""}</div>
    <p class="status" style="margin:6px 0 0">${esc(c.claim.address||"No address yet")}${c.claim.dol?` · Loss ${esc(c.claim.dol)}`:""}</p>
    <div class="chips" style="margin-top:10px"><span class="chip"><b>${c.lines.length}</b> lines</span><span class="chip"><b>${(c.photos||[]).length}</b> photos</span><span class="chip"><b>${(c.equip||[]).length}</b> equipment</span><span class="chip">RCV <b>${money(t.rcv)}</b></span></div>
    <div class="row" style="justify-content:space-between;margin-top:12px"><span class="status">Saved ${c.updated?new Date(c.updated).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):""}</span>
      <div class="row">${cur?`<button class="btn small primary" data-tab="claim">Continue</button>`:`<button class="btn ghost small" data-act="delclaim" data-id="${esc(c.id)}">Delete</button><button class="btn small primary" data-act="openclaim" data-id="${esc(c.id)}">Open</button>`}</div></div></article>`; }).join("")}</div>` : `<div class="panel empty">No claims yet. Tap New claim to start one.</div>`;
  const st=$("#storeState"); if(st){ try{ const e=await navigator.storage?.estimate?.(); const p=await navigator.storage?.persisted?.();
    st.textContent = (e? `Using ${(e.usage/1048576).toFixed(1)} MB on this device. `:"") + (p? "Protected from automatic cleanup." : "The browser may clear this data if the device runs low on space, so back up claims you care about with Save claim file."); }catch(x){ st.textContent="Saved on this device."; } }
}

/* ---------- AI agent connection ---------- */
const CFG = Object.assign({ apiBase:"api/" }, window.SCOPE_CONFIG||{});
const API = p => CFG.apiBase.replace(/\/?$/,"/") + p;
const AI_CODE_KEY = "scopeApp.aiCode";
function getCode(){ try{ return localStorage.getItem(AI_CODE_KEY)||""; }catch(e){ return ""; } }
let aiInfo = { needsCode:false, reason:"" };
function parseLoose(t){
  try{ return JSON.parse(t); }catch(e){}
  const m=String(t).match(/```(?:json)?\s*([\s\S]*?)```/); if(m){ try{ return JSON.parse(m[1]); }catch(e){} }
  const i=t.search(/[\[{]/), j=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]")); if(i>=0&&j>i){ try{ return JSON.parse(t.slice(i,j+1)); }catch(e){} }
  return undefined;
}
async function blobToImg(b){
  try{ const bmp=await createImageBitmap(b); const k=Math.min(1,1280/Math.max(bmp.width,bmp.height)); const c=document.createElement("canvas");
    c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k); c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return {media_type:"image/jpeg", data:c.toDataURL("image/jpeg",0.8).split(",")[1]}; }
  catch(e){ const u=await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result)); fr.onerror=()=>res(""); fr.readAsDataURL(b); });
    return {media_type:b.type||"image/jpeg", data:u.split(",")[1]||""}; }
}
async function makeSample(){
  try{ const r=await fetch(API("health"),{cache:"no-store"}); if(!r.ok) throw 0; const h=await r.json();
    aiInfo={ needsCode:!!h.code, reason:"" };
    if(!h.ai){ aiInfo.reason="The AI agent isn't switched on for this app yet. Whoever hosts it needs to add an Anthropic API key (see the README)."; return null; } }
  catch(e){ aiInfo={ needsCode:false, reason: navigator.onLine ? "This copy of the app has no AI server. The checklists, equipment log, photos and report all work without it." : "You're offline. The AI agent needs a connection; everything else works offline." }; return null; }
  const fn = async (input, opts={})=>{
    if(!navigator.onLine) throw {code:"offline"};
    const images=[]; for(const b of (opts.images||[]).slice(0,8)) images.push(await blobToImg(b));
    const prompt = typeof input==="string" ? input : input.map(t=>t.content).join("\n\n");
    let r; try{ r=await fetch(API("agent"),{ method:"POST", headers:{"content-type":"application/json","x-app-code":getCode()}, body:JSON.stringify({prompt,images,json:!!opts._json}), signal:opts.signal }); }
    catch(e){ throw {code: e?.name==="AbortError"?"cancelled":"upstream_error", message:String(e)}; }
    const d=await r.json().catch(()=>({}));
    if(r.status===401) throw {code:"bad_code"};
    if(r.status===413) throw {code:"prompt_too_large"};
    if(r.status===429) throw {code:"rate_limited"};
    if(r.status===504||r.status===500&&/timeout/i.test(d.error||"")) throw {code:"timeout"};
    if(!r.ok) throw {code:"upstream_error", message:d.error||""};
    opts.onText?.({text:d.text||"", delta:d.text||""});
    return {text:d.text||"", truncated:!!d.truncated};
  };
  fn.json = async (input, opts={})=>{ const {text}=await fn(input,{...opts,_json:true}); const v=parseLoose(text); if(v===undefined) throw {code:"invalid_json", text}; return v; };
  fn.limits = async ()=>({ images:{ maxCount:8, maxBytes:15e6, mediaTypes:["image/jpeg","image/png","image/webp","image/gif"] } });
  return fn;
}

/* ---------- Files: save and print ---------- */
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
function makeDownloads(){ return { save: async ({filename,data})=>{
  const blob = data instanceof Blob ? data : new Blob([data]);
  if(IOS && navigator.canShare){ const file=new File([blob],filename,{type:blob.type||"application/octet-stream"});
    if(navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:filename}); return {status:"saved"}; }catch(e){ if(e?.name==="AbortError") throw {code:"cancelled"}; } } }
  const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000); return {status:"saved"}; } }; }
function printHTML(html){
  const f=document.createElement("iframe"); f.setAttribute("aria-hidden","true"); f.style.cssText="position:fixed;right:0;bottom:0;width:0;height:0;border:0";
  document.body.appendChild(f); f.onload=()=>{ setTimeout(()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ toast("Printing isn't available here. Use Save report instead."); } setTimeout(()=>f.remove(),60000); },300); };
  f.srcdoc=html;
}

/* ---------- Install, offline, updates ---------- */
let deferredInstall=null;
addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredInstall=e; const b=$("#installBtn"); if(b) b.hidden=false; });
addEventListener("appinstalled",()=>{ const b=$("#installBtn"); if(b) b.hidden=true; toast("Installed. Open Scope from your home screen or apps."); });
function netState(){ const c=$("#offChip"); if(c) c.hidden=navigator.onLine; }
addEventListener("online",async()=>{ netState(); if(!sampleFn){ sampleFn=await makeSample(); if(cur==="agent") render(); } });
addEventListener("offline",netState);
if("serviceWorker" in navigator && location.protocol!=="file:"){
  addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.addEventListener("updatefound",()=>{ const w=reg.installing; w&&w.addEventListener("statechange",()=>{ if(w.state==="activated"&&navigator.serviceWorker.controller) toast("App updated. Close and reopen it to use the new version."); }); });
  }).catch(()=>{}); });
}

/* ---------- Boot ---------- */
(async function boot(){
  try{ IDB.db=await idbOpen(); }catch(e){ IDB.db=null; }
  if(IDB.db){ try{ const id=await idbGet("meta","current"); if(id) S=await idbGet("claims",id); }catch(e){} }
  if(!S){ try{ const raw=localStorage.getItem(KEY); if(raw) S=JSON.parse(raw); }catch(e){} }
  if(!S||!S.claim) S=sampleState();
  normalize(); netState(); renderTabs(); render(); persist();
  try{ navigator.storage?.persist?.(); }catch(e){}
  dlFn=makeDownloads(); sampleFn=await makeSample(); sampleReady=true;
  if(["agent","estimate","photos","claims"].includes(cur)){ const y=window.scrollY; render(); window.scrollTo({top:y}); }
})();

</script>
